services:
  sentinel:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTINEL_MODEL=${SENTINEL_MODEL:-claude-opus-4-8}
      # A local model server on the host is not on the container's loopback:
      # use http://host.docker.internal:11434/v1 rather than 127.0.0.1.
      - SENTINEL_PROVIDER=${SENTINEL_PROVIDER:-}
      - SENTINEL_LOCAL_BASE_URL=${SENTINEL_LOCAL_BASE_URL:-}
      - SENTINEL_LOCAL_MODEL=${SENTINEL_LOCAL_MODEL:-}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    # network_mode: host   # uncomment on a Linux host to let recon reach the LAN directly
    restart: unless-stopped
