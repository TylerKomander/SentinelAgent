# Remediation rules. A rule matches an alert by a case-insensitive substring of its
# summary; the first match wins. No matching rule means no automatic action.
#
# auto_remediate: true  -> the agent MAY apply the fix with nobody watching.
# auto_remediate: false -> suggest only; a human clicks "Apply fix" on the dashboard.
#
# Opting a rule in is necessary but NOT sufficient. An unattended fix also requires:
#   1. SENTINEL_AUTO_REMEDIATE armed in the environment (master switch, default off)
#   2. a verdict of `actionable` carrying a proposed_action
#   3. action_verified — the target IP was seen in real tool output, not just claimed
#      by the alert, which a synthetic or spoofed alert could do
#   4. the command matching a shape in config/remediation_allowlist.txt
#   5. the command not already applied (the ledger in data/applied.jsonl)
#
# Every refusal is written to the audit log with the gate that stopped it.
# Default posture is suggest-only. Turn a rule on once you trust it on that alert type.
rules:
  - match: "brute-force"
    auto_remediate: false
  - match: "C2"
    auto_remediate: false
  - match: "port scan"
    auto_remediate: false
